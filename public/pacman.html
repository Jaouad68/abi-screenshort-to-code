<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#05030f" />
<title>Pac-Man</title>
<style>
  :root { --neon: #2a4bff; --yellow: #ffe21f; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: radial-gradient(circle at 50% 0%, #131033 0%, #05030f 60%);
    color: #eef;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    overflow: hidden;
  }
  #pac-wrap {
    height: 100%;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; padding: 12px;
  }
  .pac-hud {
    width: 100%; max-width: 560px;
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px; font-weight: 700; letter-spacing: .04em;
  }
  .pac-hud .box { text-align: center; }
  .pac-hud .lbl { font-size: 10px; color: #8ea2ff; text-transform: uppercase; letter-spacing: .12em; }
  .pac-hud .val { font-size: 20px; color: #fff; font-variant-numeric: tabular-nums; }
  #pac-lives { display: flex; gap: 5px; min-height: 16px; }
  .pac-life {
    width: 16px; height: 16px; border-radius: 50%;
    background: conic-gradient(from 34deg at 46% 50%, var(--yellow) 0 292deg, transparent 292deg 360deg);
    filter: drop-shadow(0 0 4px rgba(255,226,31,.7));
  }
  .stage {
    position: relative; width: 100%; max-width: 560px;
    border-radius: 16px; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(80,110,255,.25), 0 18px 50px rgba(0,0,0,.6),
                inset 0 0 60px rgba(30,50,180,.15);
  }
  #pac-canvas { display: block; width: 100%; height: auto; image-rendering: auto; background: #05030f; }
  .pac-overlay {
    position: absolute; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; text-align: center; padding: 20px;
    background: rgba(5,3,15,.82); backdrop-filter: blur(3px);
  }
  .pac-overlay.show { display: flex; }
  .pac-overlay h1 {
    margin: 0; font-size: clamp(28px, 8vw, 52px); letter-spacing: .06em;
    color: var(--yellow); text-shadow: 0 0 20px rgba(255,226,31,.55);
  }
  .pac-overlay p { margin: 0; color: #c8d2ff; font-size: 15px; line-height: 1.5; }
  .pac-btn {
    border: 0; cursor: pointer; font-weight: 800; letter-spacing: .05em;
    font-size: 16px; padding: 13px 30px; border-radius: 999px; color: #12102b;
    background: linear-gradient(180deg, #ffe875, var(--yellow));
    box-shadow: 0 8px 24px rgba(255,226,31,.35); transition: transform .08s ease;
  }
  .pac-btn:active { transform: scale(.96); }
  .pac-pad {
    display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px);
    gap: 8px; touch-action: none;
  }
  .pac-pad button {
    border: 1px solid rgba(120,150,255,.35); background: rgba(30,40,90,.5);
    color: #cfe; font-size: 22px; border-radius: 12px; cursor: pointer;
  }
  .pac-pad button:active { background: rgba(60,90,220,.7); }
  .pac-pad .up { grid-area: 1 / 2; } .pac-pad .left { grid-area: 2 / 1; }
  .pac-pad .right { grid-area: 2 / 3; } .pac-pad .down { grid-area: 3 / 2; }
  .hint { font-size: 12px; color: #7c88bf; text-align: center; }
  @media (min-width: 720px) { .pac-pad { display: none; } }
</style>
</head>
<body>
  <div id="pac-wrap">
    <div class="pac-hud">
      <div class="box"><div class="lbl">Score</div><div class="val" id="pac-score">0</div></div>
      <div class="box"><div class="lbl">Record</div><div class="val" id="pac-high">0</div></div>
      <div class="box"><div class="lbl">Niveau</div><div class="val" id="pac-level">1</div></div>
      <div class="box"><div class="lbl">Vies</div><div id="pac-lives"></div></div>
    </div>

    <div class="stage">
      <canvas id="pac-canvas"></canvas>
      <div class="pac-overlay" id="pac-overlay">
        <h1 id="pac-overlay-title">PAC-MAN</h1>
        <p id="pac-overlay-text"></p>
        <button class="pac-btn" id="pac-overlay-btn">Jouer</button>
      </div>
    </div>

    <div class="pac-pad">
      <button class="up" data-dir="up" aria-label="Haut">▲</button>
      <button class="left" data-dir="left" aria-label="Gauche">◀</button>
      <button class="right" data-dir="right" aria-label="Droite">▶</button>
      <button class="down" data-dir="down" aria-label="Bas">▼</button>
    </div>
    <div class="hint">Flèches / ZQSD pour bouger · P pour pause · glisse sur le plateau au doigt</div>
  </div>

<script>
/* ===========================================================================
   PAC-MAN — moderne, sans bug, très fonctionnel
   Labyrinthe classique · 4 fantômes (scatter/chase/frightened/eyes) · tunnels
   · super-gommes · niveaux · vies · score · record persistant · tactile.
   =========================================================================== */
(function () {
  'use strict';

  const MAZE = [
    '############################',
    '#............##............#',
    '#.####.#####.##.#####.####.#',
    '#o####.#####.##.#####.####o#',
    '#.####.#####.##.#####.####.#',
    '#..........................#',
    '#.####.##.########.##.####.#',
    '#.####.##.########.##.####.#',
    '#......##....##....##......#',
    '######.#####.##.#####.######',
    '     #.#####.##.#####.#     ',
    '     #.##..........##.#     ',
    '     #.## ###--### ##.#     ',
    '     #.## #      # ##.#     ',
    '      ....#      #....      ',
    '     #.## #      # ##.#     ',
    '     #.## ######## ##.#     ',
    '     #.##..........##.#     ',
    '     #.#####.##.#####.#     ',
    '######.#####.##.#####.######',
    '#............##............#',
    '#.####.#####.##.#####.####.#',
    '#o..##.......##.......##..o#',
    '###.##.##.########.##.##.###',
    '#......##....##....##......#',
    '#.##########.##.##########.#',
    '#..........................#',
    '############################'
  ];

  const COLS = 28;
  const ROWS = MAZE.length;
  const TUNNEL_ROW = 14;
  const TS = 22;

  const UP = { x: 0, y: -1 }, DOWN = { x: 0, y: 1 }, LEFT = { x: -1, y: 0 }, RIGHT = { x: 1, y: 0 };
  const DIRS = [UP, LEFT, DOWN, RIGHT];
  function eq(a, b) { return !!a && !!b && a.x === b.x && a.y === b.y; }

  let grid, dots, pelletsLeft = 0;
  function buildGrid() { grid = MAZE.map(row => row.split('')); }
  function isWall(col, row) {
    if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return true;
    const ch = grid[row][col];
    return ch === '#' || ch === '-';
  }

  function buildDots(spawn) {
    dots = []; const reach = [];
    for (let r = 0; r < ROWS; r++) { dots.push(new Array(COLS).fill(0)); reach.push(new Array(COLS).fill(false)); }
    const stack = [[spawn.col, spawn.row]];
    reach[spawn.row][spawn.col] = true;
    while (stack.length) {
      const [c, r] = stack.pop();
      for (const d of DIRS) {
        let nc = c + d.x, nr = r + d.y;
        if (nc < 0) nc = COLS - 1; if (nc >= COLS) nc = 0;
        if (nr < 0 || nr >= ROWS) continue;
        if (reach[nr][nc] || isWall(nc, nr)) continue;
        reach[nr][nc] = true; stack.push([nc, nr]);
      }
    }
    pelletsLeft = 0;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (!reach[r][c]) continue;
      const ch = MAZE[r][c];
      if (ch === '.') { dots[r][c] = 1; pelletsLeft++; }
      else if (ch === 'o') { dots[r][c] = 2; pelletsLeft++; }
    }
  }

  const cx = col => (col + 0.5) * TS, cy = row => (row + 0.5) * TS;
  function canPass(col, row) {
    if (col < 0 || col >= COLS) return row === TUNNEL_ROW;
    return !isWall(col, row);
  }

  function bfsDir(fromC, fromR, toC, toR) {
    const key = (c, r) => r * COLS + c;
    const prev = new Map(); const q = [[fromC, fromR]];
    prev.set(key(fromC, fromR), null);
    let found = false;
    while (q.length) {
      const [c, r] = q.shift();
      if (c === toC && r === toR) { found = true; break; }
      for (const d of DIRS) {
        let nc = c + d.x, nr = r + d.y;
        if (nc < 0) nc = COLS - 1; if (nc >= COLS) nc = 0;
        if (nr < 0 || nr >= ROWS || isWall(nc, nr)) continue;
        const k = key(nc, nr);
        if (prev.has(k)) continue;
        prev.set(k, { c, r, d }); q.push([nc, nr]);
      }
    }
    if (!found) return null;
    let k = key(toC, toR), step = null;
    while (prev.get(k)) { const p = prev.get(k); step = p.d; k = key(p.c, p.r); }
    return step;
  }

  const PAC_SPAWN = { col: 13, row: 17 };
  const pac = { col: 0, row: 0, frac: 0, dir: null, nextDir: null, px: 0, py: 0, speed: 7.8, mouth: 0 };

  const GHOST_DEFS = [
    { name: 'blinky', color: '#ff0000', seat: { col: 13, row: 11 }, scatter: { col: 25, row: -2 }, releaseAt: 0.0, startOut: true },
    { name: 'pinky', color: '#ffb8ff', seat: { col: 13, row: 14 }, scatter: { col: 2, row: -2 }, releaseAt: 2.0, startOut: false },
    { name: 'inky', color: '#00ffff', seat: { col: 11, row: 14 }, scatter: { col: 27, row: 30 }, releaseAt: 5.0, startOut: false },
    { name: 'clyde', color: '#ffb851', seat: { col: 16, row: 14 }, scatter: { col: 0, row: 30 }, releaseAt: 8.0, startOut: false }
  ];
  let ghosts = [];
  function makeGhosts() {
    ghosts = GHOST_DEFS.map(def => ({
      name: def.name, color: def.color, seat: def.seat, scatter: def.scatter,
      releaseAt: def.releaseAt, startOut: def.startOut,
      col: def.seat.col, row: def.seat.row, frac: 0, dir: LEFT, nextDir: null,
      px: cx(def.seat.col), py: cy(def.seat.row),
      mode: 'scatter', phase: def.startOut ? 'grid' : 'house', bob: Math.random() * Math.PI * 2
    }));
  }

  let state = 'menu', score = 0, high = 0, lives = 3, level = 1;
  let roundTime = 0, stateTimer = 0, frightTimer = 0, ghostEatChain = 0, extraAwarded = false;

  const PHASES = [
    { mode: 'scatter', t: 7 }, { mode: 'chase', t: 20 }, { mode: 'scatter', t: 7 }, { mode: 'chase', t: 20 },
    { mode: 'scatter', t: 5 }, { mode: 'chase', t: 20 }, { mode: 'scatter', t: 5 }, { mode: 'chase', t: Infinity }
  ];
  let phaseIndex = 0, phaseTimer = 0, globalMode = 'scatter';
  const FRIGHT_DURATION = 6;
  const spd = base => base + Math.min(2, (level - 1) * 0.25);

  const canvas = document.getElementById('pac-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = COLS * TS; canvas.height = ROWS * TS;
  const el = {
    score: document.getElementById('pac-score'), high: document.getElementById('pac-high'),
    level: document.getElementById('pac-level'), lives: document.getElementById('pac-lives'),
    overlay: document.getElementById('pac-overlay'), title: document.getElementById('pac-overlay-title'),
    text: document.getElementById('pac-overlay-text'), btn: document.getElementById('pac-overlay-btn')
  };
  try { high = parseInt(localStorage.getItem('pacman-high') || '0', 10) || 0; } catch (e) { high = 0; }

  function saveHigh() { if (score > high) { high = score; try { localStorage.setItem('pacman-high', String(high)); } catch (e) {} } }

  function resetPositions() {
    pac.col = PAC_SPAWN.col; pac.row = PAC_SPAWN.row; pac.frac = 0;
    pac.dir = LEFT; pac.nextDir = null; pac.px = cx(pac.col); pac.py = cy(pac.row); pac.mouth = 0;
    makeGhosts();
    roundTime = 0; phaseIndex = 0; phaseTimer = 0; globalMode = 'scatter';
    frightTimer = 0; ghostEatChain = 0;
    for (const g of ghosts) g.mode = globalMode;
  }
  function startLevel() { buildGrid(); buildDots(PAC_SPAWN); resetPositions(); setState('ready'); }
  function newGame() { score = 0; lives = 3; level = 1; extraAwarded = false; startLevel(); }

  function setState(s) {
    state = s; stateTimer = 0; updateHud();
    if (s === 'menu') showOverlay('PAC-MAN', 'Mange toutes les gommes,<br>évite les fantômes !', 'Jouer');
    else if (s === 'ready') showOverlay('READY!', '', null);
    else if (s === 'playing') hideOverlay();
    else if (s === 'paused') showOverlay('PAUSE', 'P ou le bouton pour reprendre', 'Reprendre');
    else if (s === 'gameover') showOverlay('GAME OVER', 'Score : ' + score, 'Rejouer');
    else if (s === 'win') showOverlay('NIVEAU ' + level + ' TERMINÉ !', 'Score : ' + score, 'Niveau suivant');
  }
  function showOverlay(title, text, btn) {
    el.title.textContent = title; el.text.innerHTML = text || '';
    if (btn) { el.btn.textContent = btn; el.btn.style.display = ''; } else { el.btn.style.display = 'none'; }
    el.overlay.classList.add('show');
  }
  function hideOverlay() { el.overlay.classList.remove('show'); }
  function updateHud() {
    el.score.textContent = score; el.high.textContent = high; el.level.textContent = level;
    el.lives.innerHTML = '';
    for (let i = 0; i < lives; i++) { const d = document.createElement('span'); d.className = 'pac-life'; el.lives.appendChild(d); }
  }

  function syncPixel(e) {
    let x = cx(e.col), y = cy(e.row);
    if (e.dir) { x += e.dir.x * e.frac * TS; y += e.dir.y * e.frac * TS; }
    e.px = x; e.py = y;
  }

  function movePac(dt) {
    pac.speed = spd(7.8);
    if (!pac.dir) {
      if (pac.nextDir && canPass(pac.col + pac.nextDir.x, pac.row + pac.nextDir.y)) pac.dir = pac.nextDir;
      else return;
    }
    pac.frac += pac.speed * dt;
    let guard = 0;
    while (pac.frac >= 1 && guard++ < 8) {
      pac.frac -= 1;
      pac.col += pac.dir.x; pac.row += pac.dir.y;
      if (pac.col < 0) pac.col = COLS - 1; else if (pac.col >= COLS) pac.col = 0;
      eatAt(pac.col, pac.row);
      if (pac.nextDir && canPass(pac.col + pac.nextDir.x, pac.row + pac.nextDir.y)) pac.dir = pac.nextDir;
      else if (!canPass(pac.col + pac.dir.x, pac.row + pac.dir.y)) { pac.dir = null; pac.frac = 0; break; }
    }
    syncPixel(pac);
    pac.mouth = (pac.mouth + dt * 10) % (Math.PI * 2);
  }

  function eatAt(col, row) {
    const d = dots[row][col];
    if (d === 1) { dots[row][col] = 0; score += 10; pelletsLeft--; }
    else if (d === 2) { dots[row][col] = 0; score += 50; pelletsLeft--; triggerFright(); }
    saveHigh();
    if (!extraAwarded && score >= 10000) { lives++; extraAwarded = true; }
    if (pelletsLeft <= 0) { setState('win'); }
    updateHud();
  }

  function triggerFright() {
    frightTimer = Math.max(2, FRIGHT_DURATION - (level - 1) * 0.5);
    ghostEatChain = 0;
    for (const g of ghosts) if (g.phase === 'grid' && (g.mode === 'scatter' || g.mode === 'chase')) {
      g.mode = 'frightened'; g.dir = { x: -g.dir.x, y: -g.dir.y };
    }
  }

  function updatePhases(dt) {
    if (frightTimer > 0) {
      frightTimer -= dt;
      if (frightTimer <= 0) { frightTimer = 0; for (const g of ghosts) if (g.mode === 'frightened') g.mode = globalMode; }
    }
    const cur = PHASES[phaseIndex];
    phaseTimer += dt;
    if (phaseTimer >= cur.t) {
      phaseTimer = 0;
      if (phaseIndex < PHASES.length - 1) phaseIndex++;
      const m = PHASES[phaseIndex].mode;
      if (m !== globalMode) {
        globalMode = m;
        for (const g of ghosts) if (g.mode === 'scatter' || g.mode === 'chase') {
          g.mode = globalMode;
          if (g.phase === 'grid') g.dir = { x: -g.dir.x, y: -g.dir.y };
        }
      }
    }
  }

  function ghostTarget(g) {
    if (g.mode === 'scatter') return g.scatter;
    const pd = pac.dir || { x: 0, y: 0 };
    if (g.name === 'blinky') return { col: pac.col, row: pac.row };
    if (g.name === 'pinky') return { col: pac.col + pd.x * 4, row: pac.row + pd.y * 4 };
    if (g.name === 'inky') {
      const bx = pac.col + pd.x * 2, by = pac.row + pd.y * 2, bl = ghosts[0];
      return { col: bx + (bx - bl.col), row: by + (by - bl.row) };
    }
    if (g.name === 'clyde') {
      const dist = (g.col - pac.col) ** 2 + (g.row - pac.row) ** 2;
      return dist > 64 ? { col: pac.col, row: pac.row } : g.scatter;
    }
    return { col: pac.col, row: pac.row };
  }

  function ghostSpeed(g) {
    if (g.mode === 'eyes') return 15;
    if (g.mode === 'frightened') return spd(5);
    return spd(7.2);
  }

  function updateGhost(g, dt) {
    if (g.phase === 'house') return houseUpdate(g, dt);
    if (g.phase === 'leaving') return leavingUpdate(g, dt);
    if (g.phase === 'entering') return enteringUpdate(g, dt);
    return gridGhost(g, dt);
  }

  function gridGhost(g, dt) {
    g.frac += ghostSpeed(g) * dt;
    let guard = 0;
    while (g.frac >= 1 && guard++ < 16) {
      g.frac -= 1;
      g.col += g.dir.x; g.row += g.dir.y;
      if (g.col < 0) g.col = COLS - 1; else if (g.col >= COLS) g.col = 0;
      ghostArrive(g);
      if (g.phase !== 'grid') { g.frac = 0; break; }
    }
    syncPixel(g);
  }

  function ghostArrive(g) {
    if (g.mode === 'eyes' && g.col === 13 && g.row === 11) {
      g.phase = 'entering'; g.px = cx(13); g.py = cy(11); return;
    }
    let chosen = null;
    if (g.mode === 'eyes') {
      chosen = bfsDir(g.col, g.row, 13, 11);
      if (chosen && !canPass(g.col + chosen.x, g.row + chosen.y)) chosen = null;
    }
    if (!chosen) {
      const target = (g.mode === 'eyes') ? { col: 13, row: 11 } : ghostTarget(g);
      const opts = [];
      for (const d of DIRS) {
        if (eq(d, { x: -g.dir.x, y: -g.dir.y })) continue;
        if (canPass(g.col + d.x, g.row + d.y)) opts.push(d);
      }
      if (opts.length === 0) { g.dir = { x: -g.dir.x, y: -g.dir.y }; return; }
      if (g.mode === 'frightened') chosen = opts[(Math.random() * opts.length) | 0];
      else {
        let best = Infinity;
        for (const d of opts) {
          const nx = g.col + d.x, ny = g.row + d.y;
          const dist = (nx - target.col) ** 2 + (ny - target.row) ** 2;
          if (dist < best) { best = dist; chosen = d; }
        }
      }
    }
    g.dir = chosen;
  }

  function houseUpdate(g, dt) {
    g.bob += dt * 5;
    g.px = cx(g.seat.col);
    g.py = cy(g.seat.row) + Math.sin(g.bob) * 4;
    if (roundTime >= g.releaseAt) g.phase = 'leaving';
  }
  function leavingUpdate(g, dt) {
    const exitX = cx(13), topY = cy(11), sp = 5 * TS * dt;
    if (Math.abs(g.px - exitX) > 1) {
      g.px += Math.sign(exitX - g.px) * Math.min(sp, Math.abs(exitX - g.px));
      g.py += Math.sign(cy(13) - g.py) * Math.min(sp, Math.abs(cy(13) - g.py));
    } else if (g.py > topY + 1) {
      g.py -= Math.min(sp, g.py - topY);
    } else {
      g.px = exitX; g.py = topY; g.col = 13; g.row = 11; g.frac = 0;
      g.dir = LEFT; g.phase = 'grid';
      g.mode = (frightTimer > 0) ? 'frightened' : globalMode;
    }
  }
  function enteringUpdate(g, dt) {
    const seatX = cx(g.seat.col), seatY = cy(g.seat.row), sp = 6 * TS * dt;
    if (g.py < seatY - 1) g.py += Math.min(sp, seatY - g.py);
    else if (Math.abs(g.px - seatX) > 1) g.px += Math.sign(seatX - g.px) * Math.min(sp, Math.abs(seatX - g.px));
    else {
      g.px = seatX; g.py = seatY; g.phase = 'house';
      g.mode = (frightTimer > 0) ? 'frightened' : globalMode;
      g.releaseAt = roundTime + 1.0; g.dir = LEFT;
    }
  }

  function checkCollisions() {
    for (const g of ghosts) {
      if (g.phase !== 'grid') continue;
      const dx = g.px - pac.px, dy = g.py - pac.py;
      if (dx * dx + dy * dy < (TS * 0.55) ** 2) {
        if (g.mode === 'frightened') {
          ghostEatChain++;
          score += 200 * Math.pow(2, Math.min(3, ghostEatChain - 1));
          saveHigh(); g.mode = 'eyes'; updateHud();
        } else if (g.mode !== 'eyes') { lives--; updateHud(); setState('dying'); return; }
      }
    }
  }

  /* --------------------------------- Rendu -------------------------------- */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function draw() {
    ctx.fillStyle = '#05030f'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    drawWalls(); drawDots(); drawGhosts(); drawPac();
  }
  function drawWalls() {
    ctx.save();
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const ch = grid[r][c];
      if (ch === '#') {
        const x = c * TS, y = r * TS;
        ctx.fillStyle = '#0b1b6b'; roundRect(x + 2, y + 2, TS - 4, TS - 4, 6); ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = '#2a4bff';
        ctx.shadowColor = '#3b6bff'; ctx.shadowBlur = 6; ctx.stroke(); ctx.shadowBlur = 0;
      } else if (ch === '-') {
        const x = c * TS, y = r * TS;
        ctx.fillStyle = '#ff9cc6'; ctx.fillRect(x, y + TS / 2 - 2, TS, 4);
      }
    }
    ctx.restore();
  }
  function drawDots() {
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const d = dots[r][c]; if (!d) continue;
      const x = cx(c), y = cy(r);
      if (d === 1) { ctx.fillStyle = '#ffe7b0'; ctx.beginPath(); ctx.arc(x, y, 2.5, 0, Math.PI * 2); ctx.fill(); }
      else {
        const pulse = 4 + Math.sin(Date.now() / 150) * 1.6;
        ctx.fillStyle = '#ffd24a'; ctx.shadowColor = '#ffd24a'; ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.arc(x, y, pulse, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
      }
    }
  }
  function drawPac() {
    const x = pac.px, y = pac.py; let ang = 0;
    if (eq(pac.dir, LEFT)) ang = Math.PI; else if (eq(pac.dir, UP)) ang = -Math.PI / 2; else if (eq(pac.dir, DOWN)) ang = Math.PI / 2;
    const open = (state === 'playing') ? (Math.abs(Math.sin(pac.mouth)) * 0.32 + 0.04) : 0.18;
    const R = TS * 0.46;
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    ctx.fillStyle = '#ffe21f'; ctx.shadowColor = '#ffe21f'; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R, open * Math.PI, (2 - open) * Math.PI); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function drawGhosts() {
    for (const g of ghosts) {
      const x = g.px, y = g.py, R = TS * 0.46;
      const frightened = g.mode === 'frightened';
      const flashing = frightened && frightTimer < 2 && Math.floor(frightTimer * 6) % 2 === 0;
      if (g.mode !== 'eyes') {
        ctx.save();
        let body = g.color; if (frightened) body = flashing ? '#ffffff' : '#1b39ff';
        ctx.fillStyle = body; ctx.shadowColor = body; ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.arc(x, y - 1, R, Math.PI, 0); ctx.lineTo(x + R, y + R * 0.8);
        const feet = 3, w = (R * 2) / feet;
        for (let i = 0; i < feet; i++) { const fx = x + R - i * w; ctx.lineTo(fx - w / 2, y + R * 0.5); ctx.lineTo(fx - w, y + R * 0.8); }
        ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0; ctx.restore();
      }
      const ed = g.dir || LEFT, ex = ed.x * 2, ey = ed.y * 2;
      if (frightened && !flashing) {
        ctx.fillStyle = '#ffd2e0'; ctx.fillRect(x - 5, y - 2, 3, 3); ctx.fillRect(x + 2, y - 2, 3, 3);
        ctx.strokeStyle = '#ffd2e0'; ctx.lineWidth = 1.5; ctx.beginPath();
        ctx.moveTo(x - 6, y + 5); ctx.lineTo(x - 3, y + 3); ctx.lineTo(x, y + 5);
        ctx.lineTo(x + 3, y + 3); ctx.lineTo(x + 6, y + 5); ctx.stroke();
      } else {
        for (const off of [-4, 4]) {
          ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(x + off, y - 1, 3.2, 4, 0, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#0a1aff'; ctx.beginPath(); ctx.arc(x + off + ex, y - 1 + ey, 1.8, 0, Math.PI * 2); ctx.fill();
        }
      }
    }
  }

  /* -------------------------------- Boucle -------------------------------- */
  let last = performance.now();
  function loop(now) {
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.05) dt = 0.05;
    stateTimer += dt;
    if (state === 'ready') { if (stateTimer > 1.6) setState('playing'); }
    else if (state === 'playing') {
      roundTime += dt; updatePhases(dt); movePac(dt);
      for (const g of ghosts) updateGhost(g, dt);
      checkCollisions();
    } else if (state === 'dying') {
      if (stateTimer > 1.1) { if (lives <= 0) setState('gameover'); else { resetPositions(); setState('ready'); } }
    }
    draw();
    requestAnimationFrame(loop);
  }

  /* ------------------------------- Contrôles ------------------------------ */
  function setDir(d) {
    if (state === 'menu' || state === 'gameover' || state === 'win' || state === 'paused') return;
    pac.nextDir = d;
  }
  window.addEventListener('keydown', e => {
    switch (e.key) {
      case 'ArrowUp': case 'w': case 'W': case 'z': case 'Z': setDir(UP); e.preventDefault(); break;
      case 'ArrowDown': case 's': case 'S': setDir(DOWN); e.preventDefault(); break;
      case 'ArrowLeft': case 'a': case 'A': case 'q': case 'Q': setDir(LEFT); e.preventDefault(); break;
      case 'ArrowRight': case 'd': case 'D': setDir(RIGHT); e.preventDefault(); break;
      case 'p': case 'P': if (state === 'playing') setState('paused'); else if (state === 'paused') setState('playing'); break;
      case 'Enter': primaryAction(); break;
    }
  });
  function primaryAction() {
    if (state === 'menu' || state === 'gameover') newGame();
    else if (state === 'win') { level++; startLevel(); }
    else if (state === 'paused') setState('playing');
  }
  el.btn.addEventListener('click', primaryAction);
  document.querySelectorAll('[data-dir]').forEach(b => {
    const map = { up: UP, down: DOWN, left: LEFT, right: RIGHT };
    const d = map[b.getAttribute('data-dir')];
    const h = ev => { ev.preventDefault(); setDir(d); };
    b.addEventListener('touchstart', h, { passive: false });
    b.addEventListener('mousedown', h);
  });
  let touchStart = null;
  canvas.addEventListener('touchstart', e => { touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY }; }, { passive: true });
  canvas.addEventListener('touchend', e => {
    if (!touchStart) return;
    const t = e.changedTouches[0], dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? RIGHT : LEFT); else setDir(dy > 0 ? DOWN : UP);
  }, { passive: true });
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'playing') setState('paused'); });

  buildGrid(); buildDots(PAC_SPAWN); resetPositions();
  setState('menu'); updateHud();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
