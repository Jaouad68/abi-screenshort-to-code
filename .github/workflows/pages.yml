name: Deploy to GitHub Pages

# Déploie le site statique (index.html = Station Météo Pro) sur GitHub Pages.
# L'action configure-pages active automatiquement Pages si nécessaire (enablement: true),
# donc aucune manipulation manuelle dans les réglages du dépôt n'est requise.

on:
  push:
    branches:
      - claude/screenshot-app-build-t7xg6v
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
