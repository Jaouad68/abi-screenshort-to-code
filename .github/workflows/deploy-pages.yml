name: Déploiement GitHub Pages — Resto Pilot

on:
  push:
    branches: [claude/resto-pilot-dashboard-jsk113]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurer Pages (activation auto)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Téléverser l'artefact du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
