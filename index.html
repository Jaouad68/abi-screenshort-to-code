<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Resto Pilot — le copilote IA des gérants de restaurant. Tableau de bord intelligent, prévisions d'affluence, gestion des stocks, planning et analyse de rentabilité." />
  <meta name="theme-color" content="#16241F" />
  <title>Resto Pilot — Le copilote IA de votre restaurant</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="assets/css/resto.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>" />
</head>
<body>

<div class="app">
  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"><i class="fas fa-utensils"></i></div>
      <div>
        <div class="brand-name">Resto Pilot</div>
        <div class="brand-sub">La Table d'Olivier</div>
      </div>
    </div>

    <nav>
      <div class="nav-group-label">Pilotage</div>
      <button class="nav-item" data-nav="dashboard"><i class="fas fa-gauge-high"></i> Tableau de bord</button>
      <button class="nav-item" data-nav="assistant"><i class="fas fa-robot"></i> Assistant IA <span class="nav-badge amber">IA</span></button>

      <div class="nav-group-label">Opérations</div>
      <button class="nav-item" data-nav="forecast"><i class="fas fa-cloud-sun-rain"></i> Prévision &amp; affluence</button>
      <button class="nav-item" data-nav="stock"><i class="fas fa-box-open"></i> Stocks &amp; gaspillage <span class="nav-badge">7</span></button>
      <button class="nav-item" data-nav="staff"><i class="fas fa-users-gear"></i> Planning du personnel</button>

      <div class="nav-group-label">Performance</div>
      <button class="nav-item" data-nav="menu"><i class="fas fa-book-open"></i> Carte &amp; rentabilité</button>
      <button class="nav-item" data-nav="reviews"><i class="fas fa-star-half-stroke"></i> Clients &amp; avis</button>
    </nav>

    <div class="sidebar-foot">
      <div class="user-card">
        <div class="avatar">OM</div>
        <div style="flex:1;min-width:0">
          <div class="user-name">Olivier Maurin</div>
          <div class="user-role">Gérant · propriétaire</div>
        </div>
        <i class="fas fa-chevron-right" style="color:var(--on-dark-2);font-size:12px"></i>
      </div>
    </div>
  </aside>

  <div class="overlay" id="overlay"></div>

  <!-- ============ MAIN ============ -->
  <div class="main">
    <header class="topbar">
      <button class="burger" id="burger"><i class="fas fa-bars"></i></button>
      <div>
        <h1 id="pageTitle">Tableau de bord</h1>
        <div class="topbar-sub" id="pageSub">Vue d'ensemble en temps réel</div>
      </div>
      <div class="topbar-spacer"></div>
      <div class="searchbox">
        <i class="fas fa-magnifying-glass"></i>
        <input placeholder="Rechercher un plat, un stock, un avis…" />
      </div>
      <button class="icon-btn" data-toast="3 nouvelles notifications"><i class="fas fa-bell"></i><span class="dot"></span></button>
      <button class="btn btn-primary btn-sm" id="askAi"><i class="fas fa-wand-magic-sparkles"></i> Demander à l'IA</button>
    </header>

    <main class="content" id="content"><!-- injecté par app.js --></main>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
