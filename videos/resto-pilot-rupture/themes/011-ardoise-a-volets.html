<style>
  :root { --sidebar: #16241F; --board: #121B18; --tile: #1E2A26; --tile-2: #26342F; --chalk: #EDE6D8;
    --accent: #D9743F; --amber: #E8A53D; --red: #D94A3D; --green: #2E9E6B; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1920px; height: 1080px; overflow: hidden; background: #0E1513; font-family: 'Inter', sans-serif; position: relative; }
  .board { position: absolute; inset: 90px 110px 110px; background: var(--board); border-radius: 26px; padding: 56px 64px;
    box-shadow: 0 50px 100px rgba(0,0,0,.45), inset 0 0 0 2px #22302B; }
  .top { display: flex; align-items: center; gap: 22px; color: #B8B0A0; font-weight: 600; font-size: 26px; letter-spacing: .12em; margin-bottom: 48px; }
  .mark { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, var(--accent), var(--amber)); display: grid; place-items: center; }
  .mark svg { width: 28px; height: 28px; fill: #FBFAF7; }
  .top .when { margin-left: auto; color: #7E8C86; }
  .row { display: flex; gap: 10px; margin-bottom: 22px; align-items: center; }
  .cell { width: 62px; height: 92px; border-radius: 8px; background: linear-gradient(180deg, var(--tile-2) 0 49%, #0B110F 49% 51%, var(--tile) 51%);
    color: var(--chalk); font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 56px; display: grid; place-items: center; box-shadow: 0 4px 0 #0A0F0D; }
  .gap { width: 40px; }
  .status { margin-left: auto; padding: 0 26px; height: 92px; border-radius: 10px; display: grid; place-items: center;
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 36px; letter-spacing: .04em; }
  .s-ok { background: rgba(46,158,107,.18); color: #63C99A; }
  .s-watch { background: rgba(232,165,61,.16); color: var(--amber); }
  .hero .cell { background: linear-gradient(180deg, #A9372C 0 49%, #5E1D17 49% 51%, var(--red) 51%); color: #FBF3EC;
    box-shadow: 0 0 40px rgba(217,74,61,.45), 0 4px 0 #5E1D17; }
  .hero .cell.flip { transform: perspective(500px) rotateX(-38deg); transform-origin: 50% 50%; }
  .s-hot { background: var(--red); color: #FBF3EC; box-shadow: 0 0 50px rgba(217,74,61,.5); }
  .ticker { margin-top: 44px; border-top: 2px solid #22302B; padding-top: 30px; color: #E0A196; font-family: 'JetBrains Mono', monospace;
    font-size: 32px; font-weight: 700; letter-spacing: .05em; }
  .demo { position: absolute; left: 110px; bottom: 50px; color: #5F6F69; font-size: 18px; letter-spacing: .04em; }
  .label { position: absolute; right: 110px; bottom: 50px; color: #5F6F69; font-size: 18px; }
</style>
</head>
