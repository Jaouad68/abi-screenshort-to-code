<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>099 Le bureau du gérant · Resto Pilot</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --sidebar: #16241F; --ink: #18211F; --bg-soft: #FBFAF7; --surface: #FBFAF7; --muted: #6B6F68;
    --accent: #D9743F; --amber: #E8A53D; --red: #D94A3D; --red-soft: #FBE1DE; --green: #2E9E6B; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1920px; height: 1080px; overflow: hidden; font-family: 'Inter', sans-serif; color: var(--ink); position: relative;
    background: #7A5236;
    background-image: repeating-linear-gradient(92deg, rgba(255,235,210,.05) 0 3px, transparent 3px 22px),
      repeating-linear-gradient(88deg, rgba(40,20,8,.12) 0 2px, transparent 2px 57px),
      radial-gradient(ellipse at 50% 40%, #8C6142, #5E3D27 85%); }
  .sheet { position: absolute; background: #F3EEE4; box-shadow: 0 14px 30px rgba(30,15,5,.35); padding: 36px 40px; font-size: 20px; color: #4A4A44; }
  .sheet h4 { font-family: 'Fraunces', serif; font-size: 28px; color: var(--ink); margin-bottom: 18px; }
  .sheet .line { height: 12px; background: #DDD5C6; border-radius: 6px; margin: 14px 0; }
  .s1 { left: 150px; top: 120px; width: 480px; height: 620px; transform: rotate(-7deg); }
  .s2 { right: 170px; top: 170px; width: 470px; height: 560px; transform: rotate(6deg); }
  .cup { position: absolute; right: 300px; bottom: 90px; width: 210px; height: 210px; border-radius: 50%; background: #EFE8DC;
    box-shadow: 0 18px 30px rgba(30,15,5,.4), inset 0 0 0 16px #E4DACA; }
  .cup::after { content: ""; position: absolute; inset: 34px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #6B4026, #3B2213); }
  .pen { position: absolute; left: 260px; bottom: 120px; width: 380px; height: 22px; border-radius: 11px; background: linear-gradient(90deg, var(--sidebar) 85%, #C9C2B4 85%); transform: rotate(-24deg); box-shadow: 0 10px 18px rgba(30,15,5,.35); }
  .phone { position: absolute; left: 50%; top: 50%; width: 520px; height: 960px; transform: translate(-50%, -50%) rotate(-3deg); border-radius: 64px;
    background: #1B2320; padding: 22px; box-shadow: 0 50px 90px rgba(20,10,4,.55); }
  .screen { width: 100%; height: 100%; border-radius: 46px; background: linear-gradient(180deg, #23352E, #16241F); padding: 90px 26px 26px; position: relative; overflow: hidden; }
  .clock { text-align: center; color: #E9E3D7; font-family: 'Fraunces', serif; font-size: 108px; line-height: 1; }
  .date { text-align: center; color: #A9B5AF; font-size: 24px; margin: 10px 0 60px; }
  .notif { background: var(--surface); border-radius: 30px; padding: 26px 26px 22px; box-shadow: 0 20px 40px rgba(0,0,0,.35); border-left: 8px solid var(--red); }
  .app { display: flex; align-items: center; gap: 12px; font-size: 20px; color: var(--muted); font-weight: 500; margin-bottom: 14px; }
  .mark { width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(135deg, var(--accent), var(--amber)); display: grid; place-items: center; }
  .mark svg { width: 19px; height: 19px; fill: #FBFAF7; }
  .app .t { margin-left: auto; }
  .notif h3 { font-size: 28px; font-weight: 600; margin-bottom: 10px; }
  .notif p { font-size: 23px; line-height: 1.45; color: #3E423D; }
  .btn { margin-top: 20px; display: inline-flex; gap: 10px; align-items: center; background: var(--accent); color: #FBF3EC; font-weight: 600; font-size: 24px; padding: 14px 24px; border-radius: 16px; position: relative; }
  .tap { position: absolute; left: 50%; top: 50%; margin: -48px 0 0 -48px; width: 96px; height: 96px; border-radius: 50%; border: 4px solid rgba(251,250,247,.85);
    box-shadow: 0 0 0 16px rgba(251,250,247,.18); }
  .demo { position: absolute; left: 40px; bottom: 30px; color: #E6D6C2; opacity: .8; font-size: 18px; letter-spacing: .04em; }
  .label { position: absolute; right: 40px; bottom: 30px; color: #E6D6C2; opacity: .8; font-size: 18px; }
</style>
</head>
<body>
  <div class="sheet s1"><h4>Stocks &amp; gaspillage</h4><div class="line" style="width:80%"></div><div class="line" style="width:64%"></div><div class="line" style="width:72%"></div><div class="line" style="width:50%"></div><div class="line" style="width:68%"></div><div class="line" style="width:58%"></div></div>
  <div class="sheet s2"><h4>Prévision &amp; affluence</h4><div class="line" style="width:70%"></div><div class="line" style="width:82%"></div><div class="line" style="width:46%"></div><div class="line" style="width:66%"></div><div class="line" style="width:74%"></div></div>
  <div class="pen"></div>
  <div class="cup"></div>
  <div class="phone"><div class="screen">
    <div class="clock">jeudi</div>
    <div class="date">19 juin · La Table d'Olivier</div>
    <div class="notif">
      <div class="app"><div class="mark"><svg viewBox="0 0 448 512"><path d="M416 0C400 0 288 32 288 176V288c0 35.3 28.7 64 64 64h32V480c0 17.7 14.3 32 32 32s32-14.3 32-32V352 240 32c0-17.7-14.3-32-32-32zM64 16C64 7.8 57.9 1 49.7 .1S34.2 4.6 32.4 12.5L2.1 148.8C.7 155.1 0 161.5 0 167.9c0 45.9 35.1 83.6 80 87.7V480c0 17.7 14.3 32 32 32s32-14.3 32-32V255.6c44.9-4.1 80-41.8 80-87.7c0-6.4-.7-12.8-2.1-19.1L191.6 12.5c-1.8-8-9.3-13.3-17.4-12.4S160 7.8 160 16V150.2c0 5.4-4.4 9.8-9.8 9.8c-5.1 0-9.3-3.9-9.8-9L127.9 14.6C127.2 6.3 120.3 0 112 0s-15.2 6.3-15.9 14.6L83.7 151c-.5 5.1-4.7 9-9.8 9c-5.4 0-9.8-4.4-9.8-9.8V16zm48.3 152l-.3 0-.3 0 .3-.7 .3 .7z"/></svg></div>Resto Pilot<span class="t">il y a 12 min</span></div>
      <h3>Rupture imminente · Saumon frais</h3>
      <p>Stock à 2,1 kg. Vendredi soir prévu à +24 % d'affluence. Commande conseillée avant 16 h.</p>
      <div class="btn">Commander →<div class="tap"></div></div>
    </div>
  </div></div>
  <div class="demo">Données de démonstration</div>
  <div class="label">099 · Le bureau du gérant</div>
</body>
</html>
