<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/js/gsap.min.js"></script>
    <style>
      :root {
        --ground: #16241f;
        --ink: #18211f;
        --chalk: #ede6d8;
        --red: #d94a3d;
        --accent: #d9743f;
        --amber: #e8a53d;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #ground {
        position: absolute;
        inset: 0;
        background: var(--ground);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="50"
      data-width="1920"
      data-height="1080"
    >
      <div id="ground"></div>
      <div id="ardoise" data-composition-id="ardoise" data-composition-src="compositions/ardoise.html"
        data-start="0" data-duration="3.5" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 1"></div>
      <div id="imprimante" data-composition-id="imprimante" data-composition-src="compositions/imprimante.html"
        data-start="3.5" data-duration="16.5" data-track-index="2" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 2"></div>
      <div id="balance" data-composition-id="balance" data-composition-src="compositions/balance.html"
        data-start="19.5" data-duration="5" data-track-index="3" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 3"></div>
      <div id="feutre" data-composition-id="feutre" data-composition-src="compositions/feutre.html"
        data-start="24.5" data-duration="5" data-track-index="4" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 4"></div>
      <div id="rail" data-composition-id="rail" data-composition-src="compositions/rail.html"
        data-start="29.5" data-duration="5" data-track-index="5" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 5"></div>
      <div id="commande" data-composition-id="commande" data-composition-src="compositions/commande.html"
        data-start="34.5" data-duration="5.3" data-track-index="6" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 6"></div>
      <div id="vendredi" data-composition-id="vendredi" data-composition-src="compositions/vendredi.html"
        data-start="39" data-duration="4" data-track-index="7" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 7"></div>
      <div id="signature" data-composition-id="signature" data-composition-src="compositions/signature.html"
        data-start="43" data-duration="7" data-track-index="8" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 8"></div>
      <!-- Sound effects (Pixabay Content License, see assets/sfx/CREDITS.md); peaks land one frame after the picture -->
      <audio id="sfx-rembobine" class="clip" data-start="1.87" data-volume="0.5" data-track-index="20" src="assets/sfx/whoosh.mp3"></audio> <!-- plan 2 : le trait se défait -->
      <audio id="sfx-diode" class="clip" data-start="3.49" data-volume="0.8" data-track-index="21" src="assets/sfx/click.mp3"></audio> <!-- plan 3 : la diode s'allume sur le temps fort -->
      <audio id="sfx-ligne-1" class="clip" data-start="6.027" data-volume="1.0" data-track-index="22" src="assets/sfx/key-press.mp3"></audio> <!-- ligne 1 imprimée -->
      <audio id="sfx-ligne-2" class="clip" data-start="6.53" data-volume="0.35" data-track-index="23" src="assets/sfx/click.mp3"></audio> <!-- ligne 2 imprimée -->
      <audio id="sfx-ligne-3" class="clip" data-start="7.027" data-volume="1.0" data-track-index="24" src="assets/sfx/key-press.mp3"></audio> <!-- ligne 3 imprimée -->
      <audio id="sfx-ligne-4" class="clip" data-start="8.03" data-volume="0.35" data-track-index="25" src="assets/sfx/click.mp3"></audio> <!-- ligne 4 imprimée -->
      <audio id="sfx-ligne-5" class="clip" data-start="9.527" data-volume="1.0" data-track-index="26" src="assets/sfx/key-press.mp3"></audio> <!-- ligne 5 imprimée -->
      <audio id="sfx-ligne-6" class="clip" data-start="11.03" data-volume="0.35" data-track-index="27" src="assets/sfx/click.mp3"></audio> <!-- ligne 6 imprimée -->
      <audio id="sfx-ligne-7" class="clip" data-start="12.527" data-volume="1.0" data-track-index="28" src="assets/sfx/key-press.mp3"></audio> <!-- ligne 7 imprimée -->
      <audio id="sfx-ligne-8" class="clip" data-start="14.03" data-volume="0.35" data-track-index="29" src="assets/sfx/click.mp3"></audio> <!-- ligne 8 imprimée -->
      <audio id="sfx-ligne-9" class="clip" data-start="16.027" data-volume="1.0" data-track-index="30" src="assets/sfx/key-press.mp3"></audio> <!-- ligne 9 imprimée -->
      <audio id="sfx-ligne-10" class="clip" data-start="16.53" data-volume="0.35" data-track-index="31" src="assets/sfx/click.mp3"></audio> <!-- ligne 10 imprimée -->
      <audio id="sfx-emporte" class="clip" data-start="29.17" data-volume="0.5" data-track-index="32" src="assets/sfx/whoosh.mp3"></audio> <!-- plan 7 : le ticket part vers le rail -->
      <audio id="sfx-pince" class="clip" data-start="29.96" data-volume="0.6" data-track-index="33" src="assets/sfx/pop.mp3"></audio> <!-- plan 8 : le ticket est pincé au rail -->
      <audio id="sfx-clic" class="clip" data-start="35.56" data-volume="0.8" data-track-index="34" src="assets/sfx/click.mp3"></audio> <!-- plan 9 : clic sur Commander -->
      <audio id="sfx-toast" class="clip" data-start="35.5" data-volume="0.5" data-track-index="35" src="assets/sfx/notification.mp3"></audio> <!-- plan 9 : le message de confirmation -->
      <audio id="sfx-marque" class="clip" data-start="43.41" data-volume="0.35" data-track-index="36" src="assets/sfx/impact-bass-1.mp3"></audio> <!-- plan 11 : la marque se pose -->
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
