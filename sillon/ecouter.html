<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sillon : écouter</title>
  <meta name="description" content="Le lecteur Sillon : votre musique et des milliers de titres sous licence libre.">
  <meta name="theme-color" content="#FBF6EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1A1614" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="player.css">
</head>
<body class="app">
  <a class="skip" href="#vue">Aller au contenu</a>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="p-logo" viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="currentColor"/><path d="M16 9.5a6.5 6.5 0 1 1-6.5 6.5M16 5.5A10.5 10.5 0 1 1 5.5 16M16 13a3 3 0 1 1-3 3" fill="none" stroke="var(--bg)" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="p-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></symbol>
    <symbol id="p-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></symbol>
    <symbol id="p-prev" viewBox="0 0 24 24"><path d="M6 5h2v14H6zM19 5.5v13L9.5 12z" fill="currentColor"/></symbol>
    <symbol id="p-next" viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM5 5.5v13L14.5 12z" fill="currentColor"/></symbol>
    <symbol id="p-shuffle" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h3.5c2 0 3 1 4.2 3l2.6 4c1.2 2 2.2 3 4.2 3H21M3 17h3.5c1.4 0 2.3-.5 3.1-1.4M13.4 8.4c.8-.9 1.7-1.4 3.1-1.4H21"/><path d="M18 4l3 3-3 3M18 14l3 3-3 3"/></g></symbol>
    <symbol id="p-repeat" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11V9a3 3 0 0 1 3-3h12M16 3l3 3-3 3M20 13v2a3 3 0 0 1-3 3H5M8 21l-3-3 3-3"/></g></symbol>
    <symbol id="p-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.4-7.5-10A4.2 4.2 0 0 1 12 7.6 4.2 4.2 0 0 1 19.5 10C19.5 15.6 12 20 12 20z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></symbol>
    <symbol id="p-heart-on" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.4-7.5-10A4.2 4.2 0 0 1 12 7.6 4.2 4.2 0 0 1 19.5 10C19.5 15.6 12 20 12 20z" fill="currentColor"/></symbol>
    <symbol id="p-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="p-info" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.8v.2"/></g></symbol>
    <symbol id="p-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V4.5h4V7M7 7l1 13h8l1-13" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="p-vol" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></g></symbol>
    <symbol id="p-mute" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></g></symbol>
    <symbol id="p-queue" viewBox="0 0 24 24"><path d="M4 6h16M4 11h16M4 16h9M17 14v6l4-3z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="p-home" viewBox="0 0 24 24"><path d="M4 11l8-6.5 8 6.5V20h-5.5v-5h-5v5H4z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></symbol>
    <symbol id="p-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></g></symbol>
    <symbol id="p-folder" viewBox="0 0 24 24"><path d="M3.5 6.5h6l2 2h9v10.5h-17z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></symbol>
    <symbol id="p-list" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h11M4 12h11M4 17h7"/><circle cx="18" cy="16.5" r="2.3"/><path d="M20.3 16.5V6.5l-2.6.8"/></g></symbol>
  </svg>

  <aside class="side" aria-label="Navigation du lecteur">
    <a class="brand side__brand" href="./" aria-label="Sillon, page d'accueil"><svg aria-hidden="true"><use href="#p-logo"/></svg>sillon</a>
    <nav class="side__nav">
      <a href="#decouvrir" data-route="decouvrir"><svg aria-hidden="true"><use href="#p-home"/></svg>Découvrir</a>
      <a href="#recherche" data-route="recherche"><svg aria-hidden="true"><use href="#p-search"/></svg>Rechercher</a>
      <a href="#ma-musique" data-route="ma-musique"><svg aria-hidden="true"><use href="#p-folder"/></svg>Ma musique</a>
      <a href="#favoris" data-route="favoris"><svg aria-hidden="true"><use href="#p-heart"/></svg>Titres aimés</a>
      <a href="#file" data-route="file"><svg aria-hidden="true"><use href="#p-queue"/></svg>File d'attente</a>
    </nav>
    <div class="side__lists">
      <div class="side__head"><h2>Playlists</h2><button class="icon-btn" type="button" data-new-playlist aria-label="Nouvelle playlist"><svg aria-hidden="true"><use href="#p-plus"/></svg></button></div>
      <ul data-playlist-nav></ul>
    </div>
  </aside>

  <main class="view" id="vue" tabindex="-1" aria-live="polite"></main>

  <nav class="tabs" aria-label="Navigation du lecteur">
    <a href="#decouvrir" data-route="decouvrir"><svg aria-hidden="true"><use href="#p-home"/></svg>Découvrir</a>
    <a href="#recherche" data-route="recherche"><svg aria-hidden="true"><use href="#p-search"/></svg>Rechercher</a>
    <a href="#ma-musique" data-route="ma-musique"><svg aria-hidden="true"><use href="#p-folder"/></svg>Ma musique</a>
    <a href="#bibliotheque" data-route="bibliotheque"><svg aria-hidden="true"><use href="#p-list"/></svg>Playlists</a>
  </nav>

  <section class="bar" aria-label="Lecteur">
    <div class="bar__now">
      <div class="cover cover--sm" data-now-cover></div>
      <div class="bar__meta">
        <p class="bar__title" data-now-title>Rien en lecture</p>
        <p class="bar__artist" data-now-artist>Choisissez un titre pour commencer</p>
      </div>
      <button class="icon-btn" type="button" data-now-like aria-label="Ajouter aux titres aimés" aria-pressed="false" disabled><svg aria-hidden="true"><use href="#p-heart"/></svg></button>
    </div>
    <div class="bar__center">
      <div class="bar__controls">
        <button class="icon-btn" type="button" data-shuffle aria-label="Lecture aléatoire" aria-pressed="false"><svg aria-hidden="true"><use href="#p-shuffle"/></svg></button>
        <button class="icon-btn" type="button" data-prev aria-label="Titre précédent"><svg aria-hidden="true"><use href="#p-prev"/></svg></button>
        <button class="play" type="button" data-toggle aria-label="Lecture"><svg aria-hidden="true"><use href="#p-play"/></svg></button>
        <button class="icon-btn" type="button" data-next aria-label="Titre suivant"><svg aria-hidden="true"><use href="#p-next"/></svg></button>
        <button class="icon-btn" type="button" data-repeat aria-label="Répéter : désactivé" data-mode="off"><svg aria-hidden="true"><use href="#p-repeat"/></svg><span class="badge-one" aria-hidden="true">1</span></button>
      </div>
      <div class="bar__seek">
        <span data-time-cur>0:00</span>
        <input type="range" id="seek" min="0" max="0" step="1" value="0" aria-label="Position dans le titre" data-seek>
        <span data-time-dur>0:00</span>
      </div>
    </div>
    <div class="bar__side">
      <a class="icon-btn" href="#file" aria-label="File d'attente"><svg aria-hidden="true"><use href="#p-queue"/></svg></a>
      <button class="icon-btn" type="button" data-mute aria-label="Couper le son"><svg aria-hidden="true"><use href="#p-vol"/></svg></button>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" aria-label="Volume" data-volume>
    </div>
  </section>

  <dialog class="sheet" data-dialog-add>
    <form method="dialog">
      <h2>Ajouter à une playlist</h2>
      <p class="sheet__sub" data-add-track></p>
      <ul class="sheet__list" data-add-list></ul>
      <label class="field" for="new-pl-name">Ou créer une playlist
        <span class="field__row"><input id="new-pl-name" type="text" maxlength="60" placeholder="Nom de la playlist" data-add-new><button class="btn btn--sm" type="button" data-add-create>Créer et ajouter</button></span>
      </label>
      <div class="sheet__actions"><button class="link" value="cancel">Fermer</button></div>
    </form>
  </dialog>

  <dialog class="sheet" data-dialog-info>
    <form method="dialog">
      <h2>À propos de ce titre</h2>
      <div data-info-body></div>
      <div class="sheet__actions"><button class="link" value="cancel">Fermer</button></div>
    </form>
  </dialog>

  <dialog class="sheet" data-dialog-name>
    <form method="dialog" data-name-form>
      <h2 data-name-title>Nouvelle playlist</h2>
      <label class="field" for="pl-name">Nom
        <input id="pl-name" type="text" maxlength="60" required data-name-input>
      </label>
      <div class="sheet__actions"><button class="link" value="cancel" formnovalidate>Annuler</button><button class="btn btn--sm" value="ok">Enregistrer</button></div>
    </form>
  </dialog>

  <div class="toast" role="status" aria-live="polite" hidden data-toast></div>
  <audio data-audio preload="metadata"></audio>
  <script src="player.js" defer></script>
</body>
</html>
